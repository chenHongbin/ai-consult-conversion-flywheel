interface:
  display_name: "AI咨询转化飞轮"
  short_description: "蒸馏销冠、复制团队、管理咨询转化的 AI Skill"
  default_prompt: "使用 $medical-consult-conversion-coach（AI咨询转化飞轮）。安装后无需等待蒸馏即可直接分析咨询、识别费用/效果/信任等顾虑、安排回访和新人陪练；总入口会自动路由到专项能力。需要初始化本地资料时，必须执行 scripts/init_consult_workspace.py 创建标准的“咨询转化工作区”，再执行 scripts/verify_consult_workspace.py；不得手工创建替代目录，只有校验 status=canonical 才能报告初始化完成。只有在我明确指定后才接入本地或 IMA 资料。默认使用咨询转化八步法，也可以生成朋友圈文案和微信跟进文案、生成咨询视觉素材、生成合成陪练场景、生成员工纵向报告、分析团队会议、运行夜间 Dream Cycle、做新人陪练、批量蒸馏并更新候选能力。IMA 资料先建立清单、按优先级读取并在限额后断点续传；一线个人经验保存在个人成长层，不自动改写团队规则。"

policy:
  allow_implicit_invocation: true
