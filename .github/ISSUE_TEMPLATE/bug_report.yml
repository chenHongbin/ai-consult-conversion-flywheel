name: Bug 报告
description: 使用合成数据报告可复现问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "不要上传真实患者资料、机构机密、截图、录音、聊天记录或密钥。安全问题请按 SECURITY.md 私下报告。"
  - type: input
    id: version
    attributes:
      label: Core 版本
      placeholder: "例如 2.2.1"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 合成数据复现步骤
      description: 只能使用完全合成、不可识别的示例。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有提交真实患者、机构机密或访问凭证。
          required: true
