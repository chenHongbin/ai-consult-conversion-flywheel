name: Release public Core

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate tag and source
        run: |
          python -m py_compile scripts/*.py
          python -m unittest discover -s tests
          python scripts/release_check.py --tag "$GITHUB_REF_NAME"
      - name: Build and verify the single public Skill
        run: |
          python scripts/build_base_skill_package.py --output-dir dist
          PACKAGE="dist/AI咨询转化飞轮_v$(cat VERSION).skill"
          python scripts/verify_public_package.py "$PACKAGE"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE="dist/AI咨询转化飞轮_v$(cat VERSION).skill"
          gh release create "$GITHUB_REF_NAME" \
            "$PACKAGE" \
            --generate-notes --title "AI咨询转化飞轮 $GITHUB_REF_NAME"
